server:
  port: 8080

spring:
  application:
    name: codepilot-ai-review
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${CODEPILOT_DB_URL:jdbc:postgresql://localhost:15432/codepilot}
    username: ${CODEPILOT_DB_USERNAME:codepilot}
    password: ${CODEPILOT_DB_PASSWORD:codepilot123}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    clean-disabled: true
    validate-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${CODEPILOT_REDIS_HOST:localhost}
      port: ${CODEPILOT_REDIS_PORT:16379}
      database: ${CODEPILOT_REDIS_DATABASE:0}
      timeout: ${CODEPILOT_REDIS_TIMEOUT:3s}
  rabbitmq:
    host: ${CODEPILOT_RABBITMQ_HOST:localhost}
    port: ${CODEPILOT_RABBITMQ_PORT:5672}
    username: ${CODEPILOT_RABBITMQ_USERNAME:codepilot}
    password: ${CODEPILOT_RABBITMQ_PASSWORD:codepilot123}
    virtual-host: ${CODEPILOT_RABBITMQ_VIRTUAL_HOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: ${CODEPILOT_RABBITMQ_LISTENER_CONCURRENCY:2}
        max-concurrency: ${CODEPILOT_RABBITMQ_LISTENER_MAX_CONCURRENCY:4}
        prefetch: ${CODEPILOT_RABBITMQ_LISTENER_PREFETCH:1}
        default-requeue-rejected: ${CODEPILOT_RABBITMQ_DEFAULT_REQUEUE_REJECTED:false}
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 5000ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.codepilot: info

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

codepilot:
  command:
    execution-lease: ${CODEPILOT_COMMAND_EXECUTION_LEASE:15m}
    outbox-batch-size: ${CODEPILOT_COMMAND_OUTBOX_BATCH_SIZE:20}
    outbox-lock-timeout: ${CODEPILOT_COMMAND_OUTBOX_LOCK_TIMEOUT:2m}
    outbox-confirm-timeout: ${CODEPILOT_COMMAND_OUTBOX_CONFIRM_TIMEOUT:5s}
    outbox-retry-initial-delay: ${CODEPILOT_COMMAND_OUTBOX_RETRY_INITIAL_DELAY:1s}
    outbox-retry-max-delay: ${CODEPILOT_COMMAND_OUTBOX_RETRY_MAX_DELAY:1m}
    outbox-max-attempts: ${CODEPILOT_COMMAND_OUTBOX_MAX_ATTEMPTS:10}
    recovery-batch-size: ${CODEPILOT_COMMAND_RECOVERY_BATCH_SIZE:50}
  # 死信队列运维：把最终失败的消息落库，使其可查询、可重放、可告警。
  # 此前两个 DLQ 只有声明与绑定、没有消费者，消息进去就永久滞留。
  dlq:
    consumer-enabled: ${CODEPILOT_DLQ_CONSUMER_ENABLED:true}
    # 重放会把有副作用的消息重新投回主链路，因此默认关闭。
    replay-enabled: ${CODEPILOT_DLQ_REPLAY_ENABLED:false}
    retention-days: ${CODEPILOT_DLQ_RETENTION_DAYS:30}
    payload-max-chars: ${CODEPILOT_DLQ_PAYLOAD_MAX_CHARS:4000}
    maintenance-interval-millis: ${CODEPILOT_DLQ_MAINTENANCE_INTERVAL_MILLIS:30000}
  agent-runtime:
    resumable-enabled: ${CODEPILOT_AGENT_RESUMABLE_ENABLED:true}
    max-model-turns: ${CODEPILOT_AGENT_MAX_MODEL_TURNS:8}
    max-tool-calls: ${CODEPILOT_AGENT_MAX_TOOL_CALLS:12}
    max-continuations: ${CODEPILOT_AGENT_MAX_CONTINUATIONS:4}
    run-deadline: ${CODEPILOT_AGENT_RUN_DEADLINE:30m}
    continuation-context-max-chars: ${CODEPILOT_AGENT_CONTINUATION_CONTEXT_MAX_CHARS:4000}
    waiting-poll-batch-size: ${CODEPILOT_AGENT_WAITING_POLL_BATCH_SIZE:50}
    conversation-max-turns: ${CODEPILOT_AGENT_CONVERSATION_MAX_TURNS:5}
    conversation-max-chars: ${CODEPILOT_AGENT_CONVERSATION_MAX_CHARS:6000}
  scheduling:
    enabled: ${CODEPILOT_SCHEDULING_ENABLED:true}
  api-auth:
    enabled: ${CODEPILOT_API_AUTH_ENABLED:true}
    api-key: ${CODEPILOT_API_AUTH_API_KEY:}
    header-name: ${CODEPILOT_API_AUTH_HEADER_NAME:X-CodePilot-Api-Key}
    protected-path-patterns: ${CODEPILOT_API_AUTH_PROTECTED_PATH_PATTERNS:/api/**}
    exclude-path-patterns: ${CODEPILOT_API_AUTH_EXCLUDE_PATH_PATTERNS:/api/github/webhook,/api/github/webhook/**}
  api-rate-limit:
    enabled: ${CODEPILOT_API_RATE_LIMIT_ENABLED:true}
    max-requests-per-window: ${CODEPILOT_API_RATE_LIMIT_MAX_REQUESTS_PER_WINDOW:60}
    window: ${CODEPILOT_API_RATE_LIMIT_WINDOW:60s}
    protected-path-patterns: ${CODEPILOT_API_RATE_LIMIT_PROTECTED_PATH_PATTERNS:/api/**}
    exclude-path-patterns: ${CODEPILOT_API_RATE_LIMIT_EXCLUDE_PATH_PATTERNS:}
  github:
    api-base-url: https://api.github.com
    auth-mode: ${CODEPILOT_GITHUB_AUTH_MODE:auto}
    token: ${CODEPILOT_GITHUB_TOKEN:}
    app-id: ${CODEPILOT_GITHUB_APP_ID:}
    app-private-key: ${CODEPILOT_GITHUB_APP_PRIVATE_KEY:}
    app-private-key-base64: ${CODEPILOT_GITHUB_APP_PRIVATE_KEY_BASE64:}
    app-installation-id: ${CODEPILOT_GITHUB_APP_INSTALLATION_ID:}
    app-token-cache-skew-seconds: ${CODEPILOT_GITHUB_APP_TOKEN_CACHE_SKEW_SECONDS:60}
    comment-enabled: ${CODEPILOT_GITHUB_COMMENT_ENABLED:false}
    comment-marker: "${CODEPILOT_GITHUB_COMMENT_MARKER:<!-- codepilot-ai-review:liche719/codeAireview -->}"
    # 评论身份标记只在正文前 N 行内匹配，避免正文里引用到标记时被误判成身份标记。
    # 各用途（审查摘要 / Agent 回复 / 命令提示 / 修复结果）的标记本身是代码常量，刻意不可配置——
    # 允许配置只会引入"两个标记被配成同一个值"从而互相覆盖的风险。
    comment-identity-header-lines: ${CODEPILOT_GITHUB_COMMENT_IDENTITY_HEADER_LINES:5}
    inline-comment-enabled: ${CODEPILOT_GITHUB_INLINE_COMMENT_ENABLED:false}
    inline-comment-max-per-task: ${CODEPILOT_GITHUB_INLINE_COMMENT_MAX_PER_TASK:10}
    webhook-enabled: ${CODEPILOT_GITHUB_WEBHOOK_ENABLED:false}
    webhook-secret: ${CODEPILOT_GITHUB_WEBHOOK_SECRET:}
    webhook-skip-signature-when-secret-empty: ${CODEPILOT_GITHUB_WEBHOOK_SKIP_SIGNATURE_WHEN_SECRET_EMPTY:false}
    bot-mention-aliases: ${CODEPILOT_GITHUB_BOT_MENTION_ALIASES:@x-pilotx,@X-PilotX}
    allowed-repositories: ${CODEPILOT_GITHUB_ALLOWED_REPOSITORIES:}
    rate-limit-max-attempts: ${CODEPILOT_GITHUB_RATE_LIMIT_MAX_ATTEMPTS:3}
    rate-limit-initial-delay-millis: ${CODEPILOT_GITHUB_RATE_LIMIT_INITIAL_DELAY_MILLIS:1000}
    rate-limit-backoff-multiplier: ${CODEPILOT_GITHUB_RATE_LIMIT_BACKOFF_MULTIPLIER:2.0}
    rate-limit-max-delay-millis: ${CODEPILOT_GITHUB_RATE_LIMIT_MAX_DELAY_MILLIS:10000}
    connect-timeout: ${CODEPILOT_GITHUB_CONNECT_TIMEOUT:5s}
    read-timeout: ${CODEPILOT_GITHUB_READ_TIMEOUT:30s}
    call-timeout: ${CODEPILOT_GITHUB_CALL_TIMEOUT:45s}
    allowed-comment-author-associations: ${CODEPILOT_GITHUB_ALLOWED_COMMENT_AUTHOR_ASSOCIATIONS:OWNER,MEMBER,COLLABORATOR}
    fix-enabled: ${CODEPILOT_GITHUB_FIX_ENABLED:false}
    fix-publish-enabled: ${CODEPILOT_GITHUB_FIX_PUBLISH_ENABLED:false}
    fix-merge-enabled: ${CODEPILOT_GITHUB_FIX_MERGE_ENABLED:false}
    fix-approval-require-same-user: ${CODEPILOT_GITHUB_FIX_APPROVAL_REQUIRE_SAME_USER:true}
    fix-max-patch-chars: ${CODEPILOT_GITHUB_FIX_MAX_PATCH_CHARS:100000}
    fix-branch-prefix: ${CODEPILOT_GITHUB_FIX_BRANCH_PREFIX:codepilot/fix-}
    fix-merge-method: ${CODEPILOT_GITHUB_FIX_MERGE_METHOD:squash}
    fix-max-files: ${CODEPILOT_GITHUB_FIX_MAX_FILES:3}
    fix-max-changed-lines: ${CODEPILOT_GITHUB_FIX_MAX_CHANGED_LINES:120}
    fix-validation-command: ${CODEPILOT_GITHUB_FIX_VALIDATION_COMMAND:git diff --check}
    fix-allowed-validation-commands: ${CODEPILOT_GITHUB_FIX_ALLOWED_VALIDATION_COMMANDS:git diff --check}
    fix-validation-allow-build-commands: ${CODEPILOT_GITHUB_FIX_VALIDATION_ALLOW_BUILD_COMMANDS:false}
    fix-validation-inherit-environment: ${CODEPILOT_GITHUB_FIX_VALIDATION_INHERIT_ENVIRONMENT:false}
    fix-validation-timeout-seconds: ${CODEPILOT_GITHUB_FIX_VALIDATION_TIMEOUT_SECONDS:300}
    fix-validation-execution-mode: ${CODEPILOT_GITHUB_FIX_VALIDATION_EXECUTION_MODE:local}
    fix-validation-docker-image: ${CODEPILOT_GITHUB_FIX_VALIDATION_DOCKER_IMAGE:}
    fix-validation-docker-network: ${CODEPILOT_GITHUB_FIX_VALIDATION_DOCKER_NETWORK:none}
  review:
    max-files-per-task: ${CODEPILOT_REVIEW_MAX_FILES_PER_TASK:30}
    max-summary-findings: ${CODEPILOT_REVIEW_MAX_SUMMARY_FINDINGS:20}
    # 审查覆盖度上报：说明哪些文件没有被审查以及原因。
    # 关闭它会让"只审了 5 / 200 个文件"的摘要看起来像完整结论，因此默认开启。
    coverage-report-enabled: ${CODEPILOT_REVIEW_COVERAGE_REPORT_ENABLED:true}
    coverage-max-listed-files: ${CODEPILOT_REVIEW_COVERAGE_MAX_LISTED_FILES:20}
    # 已审文件数 / 变更文件数 低于该比例时，摘要顶部给出醒目告警。0 表示关闭告警。
    min-coverage-ratio: ${CODEPILOT_REVIEW_MIN_COVERAGE_RATIO:0.5}
    # 跨 headSha 的 finding 记忆：避免同一问题在每次 push 后被重复评论。
    # 默认关闭——它会改变发布行为，需要灰度。
    finding-memory-enabled: ${CODEPILOT_REVIEW_FINDING_MEMORY_ENABLED:false}
    suppress-repeated-findings: ${CODEPILOT_REVIEW_SUPPRESS_REPEATED_FINDINGS:true}
    # 即使开启，也只有"本次为完整审查且 head sha 确实变化"时才会把未再现的 finding 判为已修复。
    allow-resolution: ${CODEPILOT_REVIEW_ALLOW_RESOLUTION:true}
    # 误报抑制：读取 GitHub review thread 的 resolved 状态。默认关闭（需要 GraphQL 权限）。
    # 开启后任何失败都只降级为"不抑制"，不会影响审查本身。
    dismissal-sync-enabled: ${CODEPILOT_REVIEW_DISMISSAL_SYNC_ENABLED:false}
    # 多行区间评论（R4）：finding 跨多行时发布 start_line..line 区间评论。
    # 区间不满足 GitHub 的约束（同侧/在 diff 内/连续）时自动降级为单行，不会丢失 finding。
    multiline-comment-enabled: ${CODEPILOT_REVIEW_MULTILINE_COMMENT_ENABLED:true}
    # 一键应用的建议（R5）：给评论附 GitHub 的 ```suggestion 块。
    # 默认关闭——suggestion 被点一下就会改用户代码，属写侧交互，必须显式开启。
    suggestion-enabled: ${CODEPILOT_REVIEW_SUGGESTION_ENABLED:false}
    # 单条建议的最大行数；超限则不给一键应用（仍可能以 diff 块展示）。
    suggestion-max-lines: ${CODEPILOT_REVIEW_SUGGESTION_MAX_LINES:20}
    # 不可一键应用时，是否仍把建议代码降级成 diff 块展示。false 则连代码块一起省略。
    # 默认为 true：降级展示比直接丢弃信息更有用，且 diff 块不可能被误点。
    suggestion-fallback-to-diff: ${CODEPILOT_REVIEW_SUGGESTION_FALLBACK_TO_DIFF:true}
    max-patch-chars-per-file: ${CODEPILOT_REVIEW_MAX_PATCH_CHARS_PER_FILE:12000}
    max-total-patch-chars: ${CODEPILOT_REVIEW_MAX_TOTAL_PATCH_CHARS:80000}
    max-parallel-files: ${CODEPILOT_REVIEW_MAX_PARALLEL_FILES:2}
    max-repo-context-files: ${CODEPILOT_REVIEW_MAX_REPO_CONTEXT_FILES:6}
    max-repo-context-file-chars: ${CODEPILOT_REVIEW_MAX_REPO_CONTEXT_FILE_CHARS:20000}
    max-repo-context-excerpt-chars: ${CODEPILOT_REVIEW_MAX_REPO_CONTEXT_EXCERPT_CHARS:900}
    execution-lease: ${CODEPILOT_REVIEW_EXECUTION_LEASE:15m}
    outbox-batch-size: ${CODEPILOT_REVIEW_OUTBOX_BATCH_SIZE:20}
    outbox-lock-timeout: ${CODEPILOT_REVIEW_OUTBOX_LOCK_TIMEOUT:2m}
    outbox-confirm-timeout: ${CODEPILOT_REVIEW_OUTBOX_CONFIRM_TIMEOUT:5s}
    outbox-retry-initial-delay: ${CODEPILOT_REVIEW_OUTBOX_RETRY_INITIAL_DELAY:1s}
    outbox-retry-max-delay: ${CODEPILOT_REVIEW_OUTBOX_RETRY_MAX_DELAY:1m}
    outbox-max-attempts: ${CODEPILOT_REVIEW_OUTBOX_MAX_ATTEMPTS:10}
    publication-max-attempts: ${CODEPILOT_REVIEW_PUBLICATION_MAX_ATTEMPTS:5}
    outbox-poll-interval-millis: ${CODEPILOT_REVIEW_OUTBOX_POLL_INTERVAL_MILLIS:1000}
    execution-recovery-interval-millis: ${CODEPILOT_REVIEW_EXECUTION_RECOVERY_INTERVAL_MILLIS:30000}
    publication-poll-interval-millis: ${CODEPILOT_REVIEW_PUBLICATION_POLL_INTERVAL_MILLIS:5000}
  llm:
    enabled: true
    provider: openai-compatible
    base-url: ${CODEPILOT_LLM_BASE_URL:https://api.openai.com/v1}
    api-key: ${CODEPILOT_LLM_API_KEY:}
    model: ${CODEPILOT_LLM_MODEL:gpt-4o-mini}
    temperature: 0.2
    timeout-seconds: 60
    max-review-patch-chars: ${CODEPILOT_LLM_MAX_REVIEW_PATCH_CHARS:12000}
    max-review-rules-chars: ${CODEPILOT_LLM_MAX_REVIEW_RULES_CHARS:4000}
    max-review-context-chars: ${CODEPILOT_LLM_MAX_REVIEW_CONTEXT_CHARS:8000}
    review-structured-output-enabled: ${CODEPILOT_LLM_REVIEW_STRUCTURED_OUTPUT_ENABLED:true}
    review-cache-enabled: ${CODEPILOT_LLM_REVIEW_CACHE_ENABLED:true}
    review-cache-ttl-days: ${CODEPILOT_LLM_REVIEW_CACHE_TTL_DAYS:7}
    review-cache-cleanup-enabled: ${CODEPILOT_LLM_REVIEW_CACHE_CLEANUP_ENABLED:true}
    review-cache-cleanup-cron: ${CODEPILOT_LLM_REVIEW_CACHE_CLEANUP_CRON:0 0 */6 * * *}
    call-log-cleanup-enabled: ${CODEPILOT_LLM_CALL_LOG_CLEANUP_ENABLED:true}
    call-log-retention-days: ${CODEPILOT_LLM_CALL_LOG_RETENTION_DAYS:30}
    call-log-cleanup-cron: ${CODEPILOT_LLM_CALL_LOG_CLEANUP_CRON:0 30 */6 * * *}
  embedding:
    enabled: true
    provider: openai-compatible
    base-url: ${CODEPILOT_EMBEDDING_BASE_URL:${CODEPILOT_LLM_BASE_URL:https://api.openai.com/v1}}
    api-key: ${CODEPILOT_EMBEDDING_API_KEY:${CODEPILOT_LLM_API_KEY:}}
    model: ${CODEPILOT_EMBEDDING_MODEL:text-embedding-3-small}
    dimension: ${CODEPILOT_EMBEDDING_DIMENSION:0}
    timeout-seconds: 60
  rag:
    enabled: true
    top-k: 3
    max-context-chars: 2000
    min-content-length: 20
    cache-enabled: ${CODEPILOT_RAG_CACHE_ENABLED:true}
    cache-max-size: ${CODEPILOT_RAG_CACHE_MAX_SIZE:256}
    cache-ttl-seconds: ${CODEPILOT_RAG_CACHE_TTL_SECONDS:300}
  tools:
    enabled: true
    sql-risk-enabled: true
    secret-scan-enabled: true
    test-suggestion-enabled: true
  search:
    searxng:
      enabled: ${CODEPILOT_SEARXNG_ENABLED:false}
      base-url: ${CODEPILOT_SEARXNG_BASE_URL:}
      timeout: ${CODEPILOT_SEARXNG_TIMEOUT:5s}
      max-results: ${CODEPILOT_SEARXNG_MAX_RESULTS:5}
      max-query-chars: ${CODEPILOT_SEARXNG_MAX_QUERY_CHARS:240}
      max-result-chars: ${CODEPILOT_SEARXNG_MAX_RESULT_CHARS:1200}
      allowed-domains: ${CODEPILOT_SEARXNG_ALLOWED_DOMAINS:}
      document-fetch-enabled: ${CODEPILOT_SEARXNG_DOCUMENT_FETCH_ENABLED:false}
      document-fetch-timeout: ${CODEPILOT_SEARXNG_DOCUMENT_FETCH_TIMEOUT:8s}
      document-fetch-max-bytes: ${CODEPILOT_SEARXNG_DOCUMENT_FETCH_MAX_BYTES:262144}
      document-fetch-max-chars: ${CODEPILOT_SEARXNG_DOCUMENT_FETCH_MAX_CHARS:12000}
